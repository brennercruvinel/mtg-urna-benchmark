# retrieval profile: serves search, never display
#
# av1 all-intra at a fixed crf 50, no quality gate. benchmark/experiments/13-retrieval-crf
# measured no detectable text-to-image utility loss against the lossless archive
# at 7.46x on the whole file (n=100, weak ruler). visual quality is deliberately
# bad (ssim2 p10 per bucket 9 to 34). the crf-auto ladder variant that produced the
# crf40 candidate lives in benchmark/experiments/13-retrieval-crf/specs/retrieval-crf-auto.toml.
#
# the forge needs nest v0.4.0 or later (hoffresearch/nest, tag v0.4.0, 2026-09-17). export MTG_DATA to the spellbook data root (mtg.sqlite
# and images/) and run the build from the repo root:
#
#   urna build --spec profiles/retrieval.toml
#
# output lands in candidates/retrieval/ (gitignored); promote it with
# benchmark/tools/promote.py once it is validated.

[corpus]
name = "mtgdataset"
title = "MTG card dataset (retrieval-only crf50, self-contained)"
chunker_version = "mtgdataset/1"
reproducible = true

[source]
kind = "sqlite"
db = "${MTG_DATA}/mtg.sqlite"
query = """
SELECT oracle_id, name, mana_cost, type_line, oracle_text, rarity, set_code, image_uri
FROM cards WHERE image_uri IS NOT NULL
"""
order_by = ["img_id", "oracle_id"]

[source.derive]
img_id = "basename_stem(image_uri)"

[[source.joins]]
query = "SELECT oracle_id, printed_name AS pt_name FROM names_localized WHERE lang='pt' AND lang_rank=1"
on = "oracle_id"

[source.text]
template = """
{name} ({pt_name})
{mana_cost}; {type_line}
[{rarity}, {set_code}]
{oracle_text}
"""

[source.image]
path_template = "${MTG_DATA}/images/normal/front/{img_id[0]}/{img_id[1]}/{img_id}.jpg"
label_template = "{name}"

[media]
backend = "av1"
crf = 50
tune = "still"
speed = 6
gop = "intra"
order = "none"
shard_size = 40960          # > n_items: a single video segment
dedup = true

[[models]]
preset = "potion"
text = "default"

[[models]]
preset = "clip-vit-b32"
image = "space"

[build]
preset = "hybrid"
dtype = "int8"
with_graph = true

[output]
mode = "single"
dir = "candidates/retrieval"
provenance = "standard"
embed_media = true
