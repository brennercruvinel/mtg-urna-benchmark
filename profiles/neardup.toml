# near-dup profile: reprints and near-duplicates, one self-contained .urna
#
# order=cluster + per-segment gop probe + tune still (profile near-dup).
# -29% on a corpus of same-artwork reprints (benchmark/experiments/09-inter-ordering);
# on unique cards the probe vetoes inter per segment and records why. this is the
# recommended default and the v0.3 neardup release recipe.
#
# the forge needs urna v0.4.0 or later (hoffresearch/urna, tag v0.4.0, 2026-09-17). export MTG_DATA to the spellbook data root (mtg.sqlite
# and images/) and run the build from the repo root:
#
#   urna build --spec profiles/neardup.toml
#
# output lands in candidates/neardup/ (gitignored); promote it with
# benchmark/tools/promote.py once it is validated.

[corpus]
name = "mtgdataset"
title = "MTG card dataset (near-dup profile, self-contained)"
chunker_version = "mtgdataset/1"
reproducible = true

[source]
kind = "sqlite"
db = "${MTG_DATA}/mtg.sqlite"
query = """
SELECT oracle_id, name, mana_cost, type_line, oracle_text, rarity, set_code, image_uri
FROM cards WHERE image_uri IS NOT NULL
"""
order_by = ["img_id", "oracle_id"]

[source.derive]
img_id = "basename_stem(image_uri)"

[[source.joins]]
query = "SELECT oracle_id, printed_name AS pt_name FROM names_localized WHERE lang='pt' AND lang_rank=1"
on = "oracle_id"

[source.text]
template = """
{name} ({pt_name})
{mana_cost}; {type_line}
[{rarity}, {set_code}]
{oracle_text}
"""

[source.image]
path_template = "${MTG_DATA}/images/normal/front/{img_id[0]}/{img_id[1]}/{img_id}.jpg"
label_template = "{name}"

[media]
profile = "near-dup"        # order=cluster + gop=auto (probe per segment) + tune=still
crf = 35
speed = 6
shard_size = 2048           # 19 segments on the full corpus: each decides intra/inter on its own
dedup = true

[media.cluster]
space = "clip-vit-b32"
threshold = 0.92

[[models]]
preset = "potion"
text = "default"

[[models]]
preset = "clip-vit-b32"
image = "space"

[build]
preset = "hybrid"
dtype = "int8"
with_graph = true

[output]
mode = "single"
dir = "candidates/neardup"
provenance = "standard"
embed_media = true
