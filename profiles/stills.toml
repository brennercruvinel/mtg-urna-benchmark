# stills profile: unique images, one self-contained .nest
#
# av1 all-intra, crf 35, speed 6, tune still, single segment, media embedded
# via the 0x17 blob section. the best quality-per-byte point of the av1 ladder
# on the 2048-card sample (benchmark/experiments/02-av1-variants).
#
# the forge needs nest v0.4.0 or later (hoffresearch/nest, tag v0.4.0, 2026-09-17). export MTG_DATA to the spellbook data root (mtg.sqlite
# and images/) and run the build from the repo root:
#
#   nest build --spec profiles/stills.toml
#
# output lands in candidates/stills/ (gitignored); promote it with
# benchmark/tools/promote.py once it is validated.

[corpus]
name = "mtgdataset"
title = "MTG card dataset (self-contained)"
chunker_version = "mtgdataset/1"
reproducible = true

[source]
kind = "sqlite"
db = "${MTG_DATA}/mtg.sqlite"
query = """
SELECT oracle_id, name, mana_cost, type_line, oracle_text, rarity, set_code, image_uri
FROM cards WHERE image_uri IS NOT NULL
"""
order_by = ["img_id", "oracle_id"]

[source.derive]
img_id = "basename_stem(image_uri)"

[[source.joins]]
query = "SELECT oracle_id, printed_name AS pt_name FROM names_localized WHERE lang='pt' AND lang_rank=1"
on = "oracle_id"

[source.text]
template = """
{name} ({pt_name})
{mana_cost}; {type_line}
[{rarity}, {set_code}]
{oracle_text}
"""

[source.image]
path_template = "${MTG_DATA}/images/normal/front/{img_id[0]}/{img_id[1]}/{img_id}.jpg"
label_template = "{name}"

[media]
backend = "av1"
crf = 35
tune = "still"
speed = 6
gop = "intra"
order = "none"
shard_size = 40960          # > n_items: a single video segment
dedup = true

[[models]]
preset = "potion"
text = "default"

[[models]]
preset = "clip-vit-b32"
image = "space"

[build]
preset = "hybrid"
dtype = "int8"
with_graph = true

[output]
mode = "single"
dir = "candidates/stills"
provenance = "standard"
embed_media = true
