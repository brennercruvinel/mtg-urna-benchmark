name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: install the locked base dependencies
        run: uv sync --locked

      - name: lint the bench tools and tests
        run: uvx ruff check benchmark

      - name: unit tests
        # the integration and real-release cases skip here: they need a
        # downloaded release (MTG_EVAL_RELEASE, MTG_RELEASE_DIR) and urna
        run: uv run python -m unittest discover -s benchmark/tests -v

      - name: corpus lists match the pinned card order
        # reads release/v0.3/stills/items.jsonl.gz at the pinned hub revision
        run: uv run python benchmark/tools/export_corpora.py --check

      - name: tracked release sidecars match their SHA256SUMS
        run: uv run python benchmark/tools/promote.py check-tracked release/v0.3/*/

      - name: rendered report is up to date
        run: uv run python benchmark/tools/render_report.py --check

      - name: no tracked file names a machine
        run: |
          hits=$(git ls-files | xargs grep -l -e '/Users''/' -e '/home''/' -e 'Library/Application'' Support' -e 'nn/D''ev' || true)
          dashes=$(git ls-files | grep -v '^docs/archive/' | xargs grep -l "$(printf '\342\200\224')" || true)
          if [ -n "$dashes" ]; then
            echo "em dash in tracked files:"
            echo "$dashes"
            exit 1
          fi
          if [ -n "$hits" ]; then
            echo "machine-local paths in tracked files:"
            echo "$hits"
            exit 1
          fi
