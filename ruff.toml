# lint config for benchmark/tools and benchmark/tests; the ci gate is `ruff check benchmark`.
target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["forge", "_bench_env", "_release", "prepare_from_hub", "promote", "render_report", "export_corpora"]
